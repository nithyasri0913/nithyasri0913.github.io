<!DOCTYPE HTML>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Blog | Nithyasri Srikumar</title>
    <meta name="author" content="Nithyasri Srikumar">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" href="../stylesheet.css">
  </head>

  <body>
    <div class="page">
      <a href="../" class="home">&larr; Nithyasri Srikumar</a>

      <h1>Blog</h1>
      <p class="subtitle">Notes on things I find interesting.</p>

      <!--
        To add a post: copy blog/_template/ to blog/<post-name>/, write it,
        then add an entry here (newest first):

      <p>
        <a href="post-name/"><span class="papertitle">Post title</span></a>
        <br>
        <em>Month Day, Year</em>
        <br>
        One-line summary.
      </p>
      -->

      <br>
      <p class="footer">
        Website template from <a href="https://jonbarron.info/">Jon Barron</a>
        (<a href="https://github.com/jonbarron/jonbarron_website">source code</a>).
      </p>
    </div>
    <!-- Analytics (GoatCounter): page views + link clicks, no cookies -->
    <script>
      document.querySelectorAll('a[href]').forEach(function (a) {
        if (!a.hasAttribute('data-goatcounter-click')) {
          a.setAttribute('data-goatcounter-click', 'click: ' + a.getAttribute('href'));
          a.setAttribute('data-goatcounter-title', a.textContent.trim());
        }
      });
    </script>
    <script data-goatcounter="https://nithyasri.goatcounter.com/count"
            async src="https://gc.zgo.at/count.js"></script>
  </body>
</html>
